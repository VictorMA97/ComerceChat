# Infraestructura local de la PoC (ARCHITECTURE §16.1).
name: comercechat

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: comercechat
      POSTGRES_PASSWORD: comercechat
      POSTGRES_DB: comercechat
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U comercechat -d comercechat']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '8025:8025'
      - '1025:1025'

volumes:
  postgres-data:
