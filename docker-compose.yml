# Infraestructura local de la PoC (ARCHITECTURE §16.1).
name: comercechat

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: comercechat
      POSTGRES_PASSWORD: comercechat
      POSTGRES_DB: comercechat
    ports:
      # Solo en la máquina local: con 0.0.0.0 cualquiera en la misma red llegaría a la BD (usuario y
      # contraseña por defecto) y a Redis (sin contraseña).
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Por TCP (-h 127.0.0.1): durante el primer arranque la imagen levanta un servidor temporal
      # solo por socket Unix para instalar PostGIS y luego lo reinicia. pg_isready por socket
      # lo daría por sano y las migraciones conectarían justo antes del reinicio.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U comercechat -d comercechat']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'

  # Túnel HTTPS opcional para abrir la web QR desde el móvil (pnpm poc:tunnel).
  # Expone SOLO la web QR (puerto 3000) en una URL aleatoria *.trycloudflare.com que cambia
  # cada vez que se recrea el contenedor. La API y el panel siguen siendo solo locales.
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: [tunnel]
    command: tunnel --no-autoupdate --url http://host.docker.internal:3000
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  postgres-data:
